name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  # ---------- gates ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group dev
      - run: make lint
      - run: make format-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group dev
      - run: make test

  # ---------- version check ----------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: get
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Verify pyproject.toml matches
          TOML_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$VERSION" != "$TOML_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match pyproject.toml ($TOML_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # For manual dispatch, create and push the tag
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

  # ---------- build ----------
  # One self-contained PyInstaller bundle per platform Homebrew supports.
  # PyInstaller can't cross-compile, so each target builds on a native runner.
  # The asset name (ingram-check-<target>.tar.gz) is the contract the Homebrew
  # generator (scripts/update_homebrew_formula.py) relies on.
  build-binary:
    needs: [lint, test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
          - target: macos-x86_64
            runner: macos-15-intel
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group dev
      - run: make build
      - run: tar -czf "ingram-check-${{ matrix.target }}.tar.gz" -C dist ingram-check
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ingram-check-${{ matrix.target }}.tar.gz

  build-sdist:
    needs: [lint, test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/

  # ---------- release ----------
  release:
    needs: [build-binary, build-sdist, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*

  # ---------- publish ----------
  publish-pypi:
    needs: [build-sdist, version]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent: a re-run of an already-published version is a no-op
          # rather than a hard failure (PyPI rejects duplicate uploads).
          skip-existing: true

  # ---------- homebrew ----------
  # Regenerate the multi-platform binary formula. Runs after `release` so the
  # asset download URLs the formula points at are live. The sha256 for each
  # platform is computed from the build artifacts (not by re-downloading the
  # release asset), which avoids racing against GitHub/CDN propagation.
  update-homebrew:
    needs: [release, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: saggingmeniscus/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: bins/
          merge-multiple: true
      - name: Generate formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          args=()
          for target in macos-arm64 macos-x86_64 linux-x86_64 linux-arm64; do
            tarball="bins/ingram-check-${target}.tar.gz"
            if [ ! -f "$tarball" ]; then
              echo "::error::missing build artifact $tarball"
              exit 1
            fi
            sha=$(sha256sum "$tarball" | cut -d' ' -f1)
            args+=(--sha "${target}=${sha}")
          done
          python3 source/scripts/update_homebrew_formula.py \
            --version "$VERSION" \
            --formula homebrew-tap/Formula/ingram-check.rb \
            "${args[@]}"
      - name: Commit and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ingram-check.rb
          git diff --cached --quiet || git commit -m "ingram-check ${VERSION}"
          git push
