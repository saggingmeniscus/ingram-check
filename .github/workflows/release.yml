name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  # ---------- gates ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group dev
      - run: make lint
      - run: make format-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group dev
      - run: make test

  # ---------- version check ----------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: get
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Verify pyproject.toml matches
          TOML_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$VERSION" != "$TOML_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match pyproject.toml ($TOML_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # For manual dispatch, create and push the tag
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

  # ---------- build ----------
  build-binary:
    needs: [lint, test, version]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group dev
      - run: make build
      - run: tar -czf ingram-check-macos-arm64.tar.gz -C dist ingram-check
      - uses: actions/upload-artifact@v4
        with:
          name: binary-macos-arm64
          path: ingram-check-macos-arm64.tar.gz

  build-sdist:
    needs: [lint, test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/

  # ---------- release ----------
  release:
    needs: [build-binary, build-sdist, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binary-macos-arm64
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*

  # ---------- publish ----------
  publish-pypi:
    needs: [build-sdist, version]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ---------- homebrew ----------
  update-homebrew:
    needs: [publish-pypi, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: saggingmeniscus/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Pull the authoritative sha256 from PyPI's JSON API rather than
          # downloading the sdist and hashing it ourselves: the JSON value is
          # what PyPI itself records and avoids the silent-failure mode where
          # `curl -sSL` against an un-propagated /source/ URL writes zero
          # bytes and hashes to e3b0c44... (the empty-string SHA-256).
          API="https://pypi.org/pypi/ingram-checker/${VERSION}/json"

          # Poll up to ~5 minutes for PyPI to make the release visible.
          SHA256=""
          for attempt in $(seq 1 30); do
            JSON=$(curl -fsSL "$API" || true)
            if [ -n "$JSON" ]; then
              SHA256=$(printf '%s' "$JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for f in data.get('urls', []):
              if f.get('packagetype') == 'sdist':
                  print(f['digests']['sha256'])
                  break
          ")
            fi
            if [ -n "$SHA256" ]; then
              echo "Got sdist sha256 on attempt $attempt: $SHA256"
              break
            fi
            echo "PyPI not ready (attempt $attempt), retrying in 10s..."
            sleep 10
          done

          if [ -z "$SHA256" ] || [ "$SHA256" = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
            echo "::error::Failed to retrieve a valid sdist sha256 from PyPI for ${VERSION}"
            exit 1
          fi

          URL="https://files.pythonhosted.org/packages/source/i/ingram-checker/ingram_checker-${VERSION}.tar.gz"
          cd homebrew-tap
          FORMULA="Formula/ingram-check.rb"

          sed -i "s|url \".*\"|url \"${URL}\"|" "$FORMULA"
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" "$FORMULA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git diff --cached --quiet || git commit -m "ingram-check ${VERSION}"
          git push
